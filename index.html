<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122923">
  <meta name="description" content="River Room 德州练习室。支持单人练习与联网联机，2–10 人桌，可与朋友在同一房间同桌竞技。">
  <title>River Room · 德州练习室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23162e27'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='46' fill='%23d8bb7b'%3E♠%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
  <div class="start-screen" id="startScreen">
    <header class="start-header">
      <span class="start-mark" aria-hidden="true">♠</span>
      <span>RIVER ROOM</span>
    </header>
    <main class="start-layout">
      <section class="start-hero" aria-labelledby="startTitle">
        <div class="start-hero-copy">
          <h1 id="startTitle">德州练习室</h1>
          <p>无限注德州扑克 · 单机 / 联机</p>
        </div>
        <div class="start-art" aria-hidden="true">
          <div class="start-felt"></div>
          <div class="start-playing-card start-card-queen"><span>Q<small>♥</small></span><b>♥</b></div>
          <div class="start-playing-card start-card-ace"><span>A<small>♠</small></span><b>♠</b></div>
          <div class="start-chip start-chip-gold"></div>
          <div class="start-chip start-chip-ivory"></div>
          <div class="start-chip start-chip-red"></div>
        </div>
        <dl class="start-stakes">
          <div><dt>盲注</dt><dd>10 / 20</dd></div>
          <div><dt>初始筹码</dt><dd>2,000</dd></div>
        </dl>
      </section>
      <section class="table-setup" aria-labelledby="setupTitle">
        <h2 id="setupTitle">开新桌</h2>
        <div class="mode-picker" role="group" aria-label="游戏模式">
          <button type="button" data-mode="single" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
            <span>单人练习<small>和 AI 同桌，随时开局</small></span>
          </button>
          <button type="button" data-mode="multi" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20v-1.5a7 7 0 0 1 14 0V20"/><path d="M16.6 5.6a3 3 0 0 1 0 5.8"/><path d="M17.6 20v-1.4a4.6 4.6 0 0 1 3.4-3.3"/></svg>
            <span>联机牌桌<small>建房邀请朋友，同桌竞技</small></span>
          </button>
        </div>
        <div class="setup-fields">
          <label for="seatCount">牌桌人数
            <select id="seatCount">
              <option value="2">2 人</option>
              <option value="3">3 人</option>
              <option value="4">4 人</option>
              <option value="5">5 人</option>
              <option value="6" selected>6 人</option>
              <option value="7">7 人</option>
              <option value="8">8 人</option>
              <option value="9">9 人</option>
              <option value="10">10 人</option>
            </select>
          </label>
          <label for="aiLevel">AI 强度
            <select id="aiLevel">
              <option value="easy">入门</option>
              <option value="normal" selected>标准</option>
              <option value="hard">高手</option>
            </select>
          </label>
          <label for="turnSeconds">回合时限
            <select id="turnSeconds">
              <option value="15">15 秒</option>
              <option value="30" selected>30 秒</option>
              <option value="45">45 秒</option>
              <option value="60">1 分钟</option>
              <option value="120">2 分钟</option>
              <option value="300">5 分钟</option>
            </select>
          </label>
        </div>
        <label class="setup-assist" for="startAssist">
          <span>AI 辅助<small>估算各行动的概率与期望收益</small></span>
          <input id="startAssist" type="checkbox" role="switch">
        </label>
        <div class="setup-actions">
          <button class="launch-button" id="launchGame" type="button">开始游戏</button>
          <button class="join-button" id="joinGame" type="button" hidden>加入房间</button>
          <button class="join-button" id="resumeGame" type="button" hidden>继续牌局</button>
          <button class="join-button" id="leaderboardButton" type="button">排行榜</button>
          <button class="join-button" id="resumeRoom" type="button" hidden>回到房间</button>
        </div>
      </section>
    </main>
  </div>

  <div class="app-shell" id="tableScreen" hidden>
    <aside class="nav-rail" aria-label="牌桌导航">
      <span class="brand-mark" aria-hidden="true">♠</span>
      <div class="rail-middle">
        <button class="rail-button active" title="牌桌" aria-label="牌桌" data-nav="table"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M8 10h8m-8 4h8"/></svg><span class="nav-label">牌桌</span></button>
        <button class="rail-button" title="手牌记录" aria-label="手牌记录" data-nav="history"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg><span class="nav-label">记录</span></button>
        <button class="rail-button" title="对手" aria-label="对手" data-nav="players"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span class="nav-label">对手</span></button>
        <button class="rail-button" title="排行榜" aria-label="排行榜" data-nav="leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8m-4-5v5M6 3h12v5a6 6 0 0 1-12 0V3ZM6 5H3v2a4 4 0 0 0 5 4m10-6h3v2a4 4 0 0 1-5 4"/></svg><span class="nav-label">排行</span></button>
      </div>
      <button class="rail-button" title="设置" aria-label="设置" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h2m6 0h8M4 17h8m6 0h2"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span class="nav-label">设置</span></button>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="table-top-title">
          <button class="home-button" id="homeButton" type="button" aria-label="返回首页" title="返回首页"><span aria-hidden="true">←</span> 首页</button>
          <div class="wordmark">RIVER ROOM</div>
        </div>
        <div class="top-status">
          <span id="modeLabel">6 人桌 · 标准</span>
          <button class="top-multiplayer" id="reconnectButton" type="button" hidden>重连</button>
          <button class="top-multiplayer" id="multiplayerTopButton" type="button" hidden>房间</button>
          <button class="advisor-toggle" id="advisorToggle" type="button" aria-pressed="false">AI 辅助</button>
          <button class="icon-button" id="soundToggle" type="button" aria-label="开启音效" title="音效">♪<span>音效关</span></button>
          <button class="help-button" id="helpButton" type="button" aria-label="游戏规则" title="游戏规则">?</button>
        </div>
      </header>
      <main>
        <section class="page-heading" hidden><h1>德州扑克</h1><button id="multiplayerButton" type="button" hidden>房间</button></section>
        <div class="game-layout">
          <section class="play-area" aria-label="德州扑克牌桌">
            <div class="table-toolbar">
              <div class="blind-label">盲注 <strong>10 / 20</strong></div>
              <div class="street-status" id="streetStatus">等待开始</div>
              <button id="emoteButton" class="emote-button" type="button" aria-expanded="false" title="发表情">😀 <span>表情</span></button>
              <div class="emote-panel" id="emotePanel" hidden>
                <div class="emote-head"><strong>表情</strong><span id="emoteBalance"></span><small id="emoteCooldown"></small></div>
                <div class="emote-grid" id="emoteGrid"></div>
              </div>
              <button id="speedToggle" class="speed-button" type="button" title="切换 AI 行动速度">◷ <span>标准</span></button>
            </div>
            <div class="bankroll-bar">
              <div><span>筹码</span><strong id="walletChips">2,000</strong></div>
              <div><span>欠款</span><strong id="walletDebt">0</strong></div>
              <span id="pendingLoan"></span>
              <button id="borrowButton" type="button">借入 2,000</button>
              <button id="repayButton" type="button" disabled>还款</button>
              <button id="ledgerButton" type="button" aria-label="借款记录">账本</button>
            </div>
            <div class="table-scene" id="tableScene" data-seats="6">
              <div class="ambient-light"></div>
              <div class="poker-table"><div class="table-rail"><div class="felt">
                <div class="felt-ring"></div>
                <div class="felt-grain"></div>
                <div class="community-area">
                  <div class="table-message" id="tableMessage" role="status" aria-live="polite"></div>
                  <div class="pot-label">底池 <strong id="potValue">0</strong></div>
                  <div class="pot-chips" id="potChips"></div>
                  <div class="community-cards" id="board" aria-label="公共牌"></div>
                </div>
              </div></div></div>
              <div id="seats"></div><div id="chipFlights" aria-hidden="true"></div>
            </div>
            <section class="action-dock" id="actionDock" aria-label="牌桌操作"></section>
            <details class="advisor-panel" id="advisorPanel" hidden>
              <summary><span class="advisor-marker" aria-hidden="true">✦</span><span id="advisorSummary">AI 辅助</span></summary>
              <div class="advisor-content" id="advisorContent" aria-live="polite"></div>
            </details>
          </section>
          <aside class="insight-panel">
            <div class="panel-tabs"><button class="selected" data-tab="live">牌局动态</button><button data-tab="session">本场数据</button></div>
            <div id="sideContent"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>
  <audio id="bgm" loop preload="none"><source src="bgm.m4a" type="audio/mp4"><source src="bgm.mp3" type="audio/mpeg"></audio>
  <audio id="allInTrack" src="allin.mp3" preload="none" loop></audio>
  <div class="all-in-fx" id="allInFx" aria-hidden="true">
    <div class="all-in-rays"></div>
    <div class="all-in-burst"></div>
    <div class="all-in-text"><small>ALL IN</small><strong id="allInName">玩家</strong><span id="allInAmount"></span></div>
  </div>
  <div class="showdown-fx" id="showdownFx" aria-hidden="true">
    <div class="sd-flash" aria-hidden="true"></div>
    <div class="showdown-stage">
      <div class="sd-sparks" id="sdSparks" aria-hidden="true"></div>
      <div class="showdown-board-wrap">
        <div class="showdown-board-label">公共牌 · BOARD</div>
        <div class="showdown-board" id="showdownBoard"></div>
      </div>
      <div class="showdown-kicker">SHOWDOWN · 摊牌</div>
      <h2 class="showdown-title">比牌</h2>
      <div class="showdown-panels" id="showdownPanels"></div>
      <div class="showdown-result" id="showdownResult"></div>
      <div class="showdown-hint">点击任意处跳过</div>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle">
    <div class="modal-top"><div><span class="eyebrow" id="modalEyebrow" hidden>RIVER ROOM</span><h2 id="modalTitle"></h2></div><button class="close-button" id="closeModal" type="button" aria-label="关闭">×</button></div>
    <div id="modalBody"></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js?v=43"></script>
</body>
</html>
